; PlatformIO Project Configuration File
;
; Single multi-env project for the Mini 3-DoF BLDC arm.
; Each env builds exactly one sketch from src/ via build_src_filter.
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = full

[env]
platform = ststm32
board = nucleo_g474re
framework = arduino
lib_archive = false
lib_deps = askuric/Simple FOC@^2.4.0
monitor_speed = 115200
; expose include/config.h to library code too (e.g. lib/ArmKinematics)
build_flags = -Iinclude

[env:full]
build_src_filter = -<*> +<full.cpp>
; High-rate JSON telemetry -> PlotJuggler (see docs/plotjuggler.md). Match the
; ROS2 bridge baud to TELEMETRY_BAUD; the bigger TX buffer keeps a full JSON
; line from blocking the FOC loop while it drains.
monitor_speed = 921600
build_flags = ${env.build_flags} -D SERIAL_TX_BUFFER_SIZE=256

; --- tools ---
; Live PID tuning for one joint (set TUNE_JOINT in the source). Streams the same
; JSON telemetry contract as `full` (lib/Telemetry) -> ROS2 bridge -> PlotJuggler,
; and takes Commander gain commands back over the same port (see docs/plotjuggler.md).
[env:pid_tuner]
build_src_filter = -<*> +<calibration/pid_tuner.cpp>
; Match the bridge's default baud and enlarge the TX buffer so a telemetry line
; drains without stalling the FOC loop (mirrors the `full` env).
monitor_speed = 921600
build_flags = ${env.build_flags} -D SERIAL_TX_BUFFER_SIZE=256
monitor_dtr = 0
monitor_rts = 0

[env:openloop]
build_src_filter = -<*> +<diagnostics/openloop.cpp>

[env:polefinder]
build_src_filter = -<*> +<calibration/polefinder.cpp>

[env:as5600]
build_src_filter = -<*> +<diagnostics/as5600.cpp>

[env:position]
build_src_filter = -<*> +<diagnostics/position.cpp>

[env:blink]
build_src_filter = -<*> +<diagnostics/blink.cpp>
upload_protocol = stlink
