; PlatformIO Project Configuration File
;
; Single multi-env project for the Mini 3-DoF BLDC arm.
; Each env builds exactly one sketch from src/ via build_src_filter.
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = full

[env]
platform = ststm32
board = nucleo_g474re
framework = arduino
lib_archive = false
lib_deps = askuric/Simple FOC@^2.4.0
monitor_speed = 115200
; expose include/config.h to library code too (e.g. lib/ArmKinematics)
build_flags = -Iinclude

[env:full]
build_src_filter = -<*> +<full.cpp>

[env:openloop]
build_src_filter = -<*> +<openloop.cpp>

[env:polefinder]
build_src_filter = -<*> +<polefinder.cpp>

[env:as5600]
build_src_filter = -<*> +<as5600.cpp>

[env:position]
build_src_filter = -<*> +<position.cpp>

[env:blink]
build_src_filter = -<*> +<blink.cpp>
upload_protocol = stlink
