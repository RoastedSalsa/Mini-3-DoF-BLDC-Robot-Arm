# Hyprland glue for the Mini_Ranka arm session.  Kept in the repo and pulled in
# from ~/.config/hypr/hyprland.conf with:
#
#     source = ~/Documents/Personal_Projects/Mini_Ranka/Mark1/tools/hypr/mini-ranka.conf
#
# Everything here is declarative and keyed on window class, so it does not
# matter how long a window takes to appear.  That matters: RViz can take 20+
# seconds to map, long enough that Hyprland's inline `exec` rules have already
# given up associating the window with the process that spawned it.
#
# Classes below were read off `hyprctl clients -j`, not guessed:
#   rviz2                      XWayland  (rviz2 links Qt6 xcb)
#   io.plotjuggler.PlotJuggler XWayland
#   mini-ranka-flow            native Wayland app_id, set by flow.py
#   mini-ranka-inputs/-feedback  kitty --class
#
# Written for the block rule syntax of Hyprland 0.55.

$miniRanka = ~/Documents/Personal_Projects/Mini_Ranka/Mark1/tools/mini-ranka-session

# --- workspaces ------------------------------------------------------------
# Persistent so 6 and 7 stay in waybar even before the session is up.  If the
# named monitor is unplugged Hyprland puts the workspace on whatever is left,
# and mini-ranka-session lays out against the monitor it actually finds.
workspace = 6, monitor:HDMI-A-1, persistent:true
workspace = 7, monitor:eDP-1, persistent:true

# --- windows ---------------------------------------------------------------
# The three consoles float; RViz and PlotJuggler stay tiled.  A single tiled
# window fills its workspace and Hyprland draws floating windows above tiled
# ones, which is what puts RViz behind the consoles.
windowrule {
    name = mini-ranka-consoles
    match:class = ^(mini-ranka-(inputs|feedback|flow))$

    float = yes
    workspace = 6 silent
    # Exact rects come from mini-ranka-session, which reads the live monitor
    # size — a rule cannot compute against a monitor that changes resolution.
}

windowrule {
    name = mini-ranka-rviz
    match:class = ^(rviz2?)$

    workspace = 6 silent
    float = no
    # mini-ranka-session starts RViz with --fullscreen, which is the only thing
    # that actually strips its menu bar, toolbar and docks down to a bare 3D
    # view (session.rviz's Hide Left/Right Dock keys are ignored by rviz2
    # 15.2.3).  Left alone that would also make the window cover waybar and the
    # consoles.  internal 0 / client 2 tells RViz it is fullscreen while
    # Hyprland keeps tiling it inside the workspace: bare viewport, still in the
    # background, waybar still visible.
    fullscreen_state = 0 2
}

windowrule {
    name = mini-ranka-plotjuggler
    match:class = ^(io\.plotjuggler\.PlotJuggler)$

    workspace = 7 silent
    float = no
}

# --- transparency ----------------------------------------------------------
# Window opacity is pinned to 1.0 on purpose. The see-through effect comes from
# kitty's own `background_opacity` (set in mini-ranka-session), which fades only
# the terminal background and leaves glyphs fully opaque. Hyprland's `opacity`
# fades the whole surface including the text, so leaving the global
# active/inactive opacity to apply here would make small type mushy over a
# moving 3D scene.
windowrule {
    name = mini-ranka-console-opacity
    match:class = ^(mini-ranka-(inputs|feedback|flow))$

    opacity = 1.0
    # Blur would frost the RViz scene behind the consoles into a grey smear —
    # the opposite of "see through to the arm".
    no_blur = true
}

# The flow panel paints its blocks straight onto a transparent surface
# (WA_TranslucentBackground in flow.py). Every bit of compositor chrome has to
# go too, or the blocks end up sitting on a blurred, rounded, shadowed
# rectangle — which is the window-shaped background they are meant not to have.
windowrule {
    name = mini-ranka-flow-chrome
    match:class = ^(mini-ranka-flow)$

    border_size = 0
    rounding = 0
    no_shadow = true
}

# --- session accent ---------------------------------------------------------
# Shared palette, also used by flow.py, console.py and waybar/mini-ranka.css:
#
#   ink        #eaf4f8   live / focused / you
#   ink-soft   #9fb6c2   secondary — the arm answering
#   accent     #7fd4e8   pale cyan: something changed state, right now
#   steel      #3f4b55   idle
#   alert      #ff6b5e   problems only, never decoration
#
# Cool white replaces the global amber (col.active_border) on the two session
# workspaces only, so the arm reads as one instrument panel and nothing else on
# the machine changes.
windowrule {
    name = mini-ranka-accent
    match:workspace = 6

    border_color = rgba(eef6faff) rgba(7f97a5ff) 45deg
}

windowrule {
    name = mini-ranka-accent-idle
    match:workspace = 6
    match:focus = false

    border_color = rgba(3f4b55cc)
}

windowrule {
    name = mini-ranka-accent-plot
    match:workspace = 7

    border_color = rgba(eef6faff) rgba(7f97a5ff) 45deg
}

windowrule {
    name = mini-ranka-accent-plot-idle
    match:workspace = 7
    match:focus = false

    border_color = rgba(3f4b55cc)
}

# --- keys ------------------------------------------------------------------
bind = $mainMod, A, exec, $miniRanka start
bind = $mainMod SHIFT, A, exec, $miniRanka stop

# --- autostart -------------------------------------------------------------
# Comes up silently on 6 and 7; focus stays wherever you logged in.  `start` is
# idempotent, so the SUPER+A binding above just focuses workspace 6 once this
# has run.  Delete this line to make the session keybind-only.
exec-once = $miniRanka start
